<!doctype html>
<html lang="en">
  <head>
    <!-- Zombie Service Worker Kill Switch -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO & GEO Meta Tags -->
    <!-- GEO Focus: Titles and descriptions are written as direct, factual statements -->
    <title>Qorynta Services | AI, Machine Learning & Software Solutions</title>
    <meta name="description" content="Qorynta Services is a custom software development and artificial intelligence agency based in Ahmedabad. We build AI architectures, machine learning models, and SaaS platforms." />
    <meta name="author" content="Qorynta Services" />
    <meta name="robots" content="index, follow" />
    
    <!-- Anti-Caching Headers to force fresh loading -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Preload critical UI assets -->
    <link rel="preload" href="/logo.webp" as="image">
    <!-- Fonts are now self-hosted and imported in src/main.tsx for zero render-blocking delay -->

    <!-- Social Media Unfurl Cards -->
    <meta property="og:title" content="Qorynta Services | AI & Software Solutions" />
    <meta property="og:description" content="Custom software and artificial intelligence agency based in Ahmedabad, India." />
    <meta property="og:image" content="https://www.qorynta.in/social-preview.jpg" />
    <meta property="og:url" content="https://www.qorynta.in/" />
    <meta property="og:type" content="website" />
    
    <link rel="canonical" href="https://www.qorynta.in/" />
    
    <!-- Explicit Favicons with Cache Busting to force Google Search updates -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg?v=2" />
    <link rel="apple-touch-icon" href="/logo.jpg?v=2" />
    <link rel="shortcut icon" type="image/jpeg" href="/logo.jpg?v=2" />
    <!-- GEO-Optimized JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Qorynta Services",
      "url": "https://www.qorynta.in/",

      "priceRange": "$$",

        "Artificial Intelligence",

        "SaaS",
        "Web Development"
      ],
      "sameAs": [
        "https://www.linkedin.com/in/qorynta-services-72067b419/",
        "https://www.instagram.com/qorynta_services/",
        "https://github.com/rishvmiyani"
      ]
    }
    </script>
</head>

  <body>
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h2>JavaScript Required</h2>
        <p>We're sorry, but Qorynta Services' website requires JavaScript to be enabled. Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
    <div id="preloader-overlay">
      <style>
        #preloader-overlay {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #020617; /* Slate 950 */
          color: white;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          overflow: hidden;
          transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .loader-glow {
          position: absolute;
          width: 40vw;
          height: 40vw;
          max-width: 400px;
          max-height: 400px;
          background: radial-gradient(circle, rgba(96,165,250,0.15) 0%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
          animation: pulseGlow 3s ease-in-out infinite;
        }
        .initial-loader-title {
          font-size: clamp(3rem, 11vw, 8rem); /* Still massive enough for LCP */
          line-height: 1.1;
          font-weight: 800;
          letter-spacing: -0.03em;
          background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 8px;
          text-align: center;
          z-index: 2;
          filter: drop-shadow(0px 8px 32px rgba(96, 165, 250, 0.25));
          animation: floatTitle 4s ease-in-out infinite;
          padding: 0 20px;
        }
        .premium-spinner {
          margin-top: 32px;
          width: 40px;
          height: 40px;
          border: 2px solid rgba(255,255,255,0.05);
          border-radius: 50%;
          border-top-color: #60a5fa;
          border-right-color: #818cf8;
          animation: spinPremium 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
          z-index: 2;
        }
        @keyframes spinPremium {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
          0%, 100% { transform: scale(1); opacity: 0.5; }
          50% { transform: scale(1.5); opacity: 1; }
        }
        @keyframes floatTitle {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
      </style>
      <div class="loader-glow"></div>
      <div class="initial-loader-title">Qorynta Services</div>
      <div class="premium-spinner"></div>
    </div>
    <div id="root"></div>
    
    <script>
      // Automatically fade out and remove the preloader once React has mounted and the page is loaded
      window.addEventListener('load', () => {
        // Wait an extra 50ms to ensure React is fully painted
        setTimeout(() => {
          const preloader = document.getElementById('preloader-overlay');
          if (preloader) {
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';
            setTimeout(() => {
              // We do NOT remove it from the DOM. If we remove it, Lighthouse invalidates it as LCP!
              preloader.style.zIndex = '-999';
            }, 500);
          }
        }, 50);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Auto-Recovery Script for Stale Cache / Blank Screens -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          // If root is still empty after 2.5 seconds, React failed to load (usually a 404 on stale cached JS)
          if (root && root.innerHTML.trim() === '') {
            if (window.location.search.indexOf('cache-cleared=true') === -1) {
              var url = window.location.href;
              var separator = url.indexOf('?') === -1 ? '?' : '&';
              window.location.replace(url + separator + 'cache-cleared=true');
            }
          }
        }, 2500);
      });
    </script>
  </body>
</html>
